name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  BURBLE_ECR_IMAGE_REPOSITORY: ${{ vars.BURBLE_ECR_IMAGE_REPOSITORY }}
  BURBLE_ECR_CHART_REPOSITORY: ${{ vars.BURBLE_ECR_CHART_REPOSITORY }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gates
        run: bun run ci

      - name: Run deployment validation
        run: bun run deploy:check

      - name: Run release metadata validation
        run: bun run release:check

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve and validate release coordinates
        id: release
        env:
          AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
        run: |
          : "${AWS_RELEASE_ROLE_ARN:?Set the AWS_RELEASE_ROLE_ARN repository variable}"
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${ECR_REGISTRY:?Set the ECR_REGISTRY repository variable}"
          : "${BURBLE_ECR_IMAGE_REPOSITORY:?Set the BURBLE_ECR_IMAGE_REPOSITORY repository variable}"
          : "${BURBLE_ECR_CHART_REPOSITORY:?Set the BURBLE_ECR_CHART_REPOSITORY repository variable}"

          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$(basename "$BURBLE_ECR_CHART_REPOSITORY")" = "burble"

          mkdir -p dist
          {
            printf 'version=%s\n' "$VERSION"
            printf 'image=%s/%s\n' "$ECR_REGISTRY" "$BURBLE_ECR_IMAGE_REPOSITORY"
            printf 'chart=%s/%s\n' "$ECR_REGISTRY" "$BURBLE_ECR_CHART_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: burble-release-${{ github.run_id }}

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login "$ECR_REGISTRY" --username AWS --password-stdin

      - name: Build and publish Linux/amd64 image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=burble-release
          cache-to: type=gha,mode=max,scope=burble-release

      - name: Record and scan image digest
        run: |
          printf '%s\n' '${{ steps.image.outputs.digest }}' > dist/image.digest
          docker buildx imagetools inspect \
            '${{ steps.release.outputs.image }}@${{ steps.image.outputs.digest }}' \
            --raw > dist/image-index.json
          PLATFORM_DIGEST="$(jq -r '
            [.manifests[]?
              | select(.platform.os == "linux" and .platform.architecture == "amd64")]
            | first
            | .digest // empty
          ' dist/image-index.json)"
          if [ -z "$PLATFORM_DIGEST" ]; then
            PLATFORM_DIGEST='${{ steps.image.outputs.digest }}'
          fi
          printf '%s\n' "$PLATFORM_DIGEST" > dist/image-platform.digest
          bun scripts/release/wait-for-ecr-scan.ts \
            --repository "$BURBLE_ECR_IMAGE_REPOSITORY" \
            --digest "$PLATFORM_DIGEST" \
            --output dist/ecr-image-scan.json

      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.release.outputs.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dist/burble-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate image vulnerability evidence
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ steps.release.outputs.image }}@${{ steps.image.outputs.digest }}
          format: cosign-vuln
          output: dist/burble-image.scan.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Sign and attest image evidence
        env:
          IMAGE_REFERENCE: ${{ steps.release.outputs.image }}@${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_REFERENCE"
          cosign attest --yes --type spdxjson \
            --predicate dist/burble-image.spdx.json "$IMAGE_REFERENCE"
          cosign attest --yes --type vuln \
            --predicate dist/burble-image.scan.json "$IMAGE_REFERENCE"

      - name: Attest image provenance
        id: image-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Preserve image provenance evidence
        run: cp '${{ steps.image-provenance.outputs.bundle-path }}' dist/burble-image.provenance.json

      - name: Package and publish Helm chart
        id: chart
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          helm package deploy/k8s/chart \
            --destination dist \
            --version "$VERSION" \
            --app-version "$VERSION"

          if [ "$BURBLE_ECR_CHART_REPOSITORY" = "burble" ]; then
            CHART_PARENT="oci://$ECR_REGISTRY"
          else
            CHART_PARENT="oci://$ECR_REGISTRY/${BURBLE_ECR_CHART_REPOSITORY%/burble}"
          fi
          PUSH_OUTPUT="$(helm push "dist/burble-$VERSION.tgz" "$CHART_PARENT")"
          printf '%s\n' "$PUSH_OUTPUT"
          DIGEST="$(printf '%s\n' "$PUSH_OUTPUT" | awk '$1 == "Digest:" {print $2}')"
          test -n "$DIGEST"
          printf '%s\n' "$DIGEST" > dist/chart.digest
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate chart SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          file: dist/burble-${{ steps.release.outputs.version }}.tgz
          format: spdx-json
          output-file: dist/burble-chart.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate chart vulnerability evidence
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: deploy/k8s/chart
          format: cosign-vuln
          output: dist/burble-chart.scan.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Sign and attest chart evidence
        env:
          CHART_REFERENCE: ${{ steps.release.outputs.chart }}@${{ steps.chart.outputs.digest }}
        run: |
          cosign sign --yes "$CHART_REFERENCE"
          cosign attest --yes --type spdxjson \
            --predicate dist/burble-chart.spdx.json "$CHART_REFERENCE"
          cosign attest --yes --type vuln \
            --predicate dist/burble-chart.scan.json "$CHART_REFERENCE"

      - name: Attest chart provenance
        id: chart-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.release.outputs.chart }}
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Preserve chart provenance evidence
        run: cp '${{ steps.chart-provenance.outputs.bundle-path }}' dist/burble-chart.provenance.json

      - name: Verify immutable artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker buildx imagetools inspect \
            '${{ steps.release.outputs.image }}@${{ steps.image.outputs.digest }}'
          if [ "$BURBLE_ECR_CHART_REPOSITORY" = "burble" ]; then
            CHART_PARENT="oci://$ECR_REGISTRY"
          else
            CHART_PARENT="oci://$ECR_REGISTRY/${BURBLE_ECR_CHART_REPOSITORY%/burble}"
          fi
          helm pull "$CHART_PARENT/burble" --version "$VERSION" --destination /tmp

      - name: Generate release report
        run: |
          bun scripts/release/generate-release-report.ts \
            --artifacts dist \
            --output dist/release-report.md \
            --version '${{ steps.release.outputs.version }}' \
            --registry "$ECR_REGISTRY" \
            --image-repository "$BURBLE_ECR_IMAGE_REPOSITORY" \
            --chart-repository "$BURBLE_ECR_CHART_REPOSITORY"

      - name: Create GitHub Release with evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --notes-file dist/release-report.md
